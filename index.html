/* KF-21 landscape-first mobile layout */
html,body {overscroll-behavior:none;}
#scene,#app {height:100vh;height:100dvh;}
#landscapeNotice{display:none;position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 35%,#193c5c,#071322 80%);color:#e6f4ff;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
#landscapeNotice .landscape-panel{max-width:440px;display:flex;flex-direction:column;align-items:center;gap:12px}
#landscapeNotice .turn-icon{width:68px;height:68px;border-radius:16px;border:3px solid #89cfff;display:flex;align-items:center;justify-content:center;font-size:38px;transform:rotate(90deg);margin-bottom:8px}
#landscapeNotice h2{font-size:clamp(22px,5.5vw,32px);margin:0;font-weight:900}
#landscapeNotice p{margin:0;line-height:1.7;color:#bfd5e6;font-size:14px}
#landscapeNotice button{margin-top:7px;background:#f2c35b;border:none;border-radius:11px;padding:13px 22px;color:#111c30;font-weight:900;cursor:pointer}
#landscapeNotice small{font-size:12px;color:#8eb3ce;line-height:1.6}
@media (pointer:coarse) and (orientation:portrait){#landscapeNotice{display:flex}}
@media (orientation: landscape) and (max-height:600px){
 #menu{padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));gap:8px;overflow-y:auto;justify-content:space-between}
 .brand{gap:10px;flex-shrink:0}
 .roundel{width:34px;height:34px;border-width:5px}
 .roundel:before,.roundel:after{width:10px;height:3px;top:calc(50% - 1px)}
 .brand-main{font-size:clamp(19px,3.3vw,31px);white-space:nowrap}
 .brand-sub{font-size:9px;margin-top:3px;letter-spacing:.04em}
 .menu-lower{width:100%;max-width:none;margin-top:6px}
 .kicker{font-size:10px;margin:0 0 7px}
 .cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
 .mission{min-height:105px;max-height:125px;padding:9px 10px;border-radius:10px;gap:2px}
 .mission:after{width:35px;right:-8px}
 .mission span{font-size:9px}
 .mission strong{font-size:clamp(13px,2vw,18px)}
 .mission p{font-size:10px;line-height:1.2;max-width:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 .mission small{font-size:9px}
 .menu-buttons{margin:8px 0 0;gap:7px}
 .menu-buttons button{padding:7px 11px;font-size:11px}
 .caption{display:none}
 .flighthead{top:max(5px,env(safe-area-inset-top));left:11px;right:11px}
 .flighthead strong{font-size:13px}
 .eyebrow{font-size:8px}
 .top-actions{gap:4px}
 .top-actions button{padding:6px 7px;font-size:10px}
 .objective{top:40px;left:50%;width:auto;min-width:175px;max-width:48vw;padding:5px 9px}
 .objective small{font-size:8px}
 .objective strong{font-size:10px}
 .objective span{font-size:9px}
 .flightdata{left:max(7px,env(safe-area-inset-left));top:63px;width:120px;padding:6px 9px;transform:scale(.84);transform-origin:top left}
 .entry{padding:4px 0}.entry label{font-size:9px}.entry strong{font-size:12px}.entry small{font-size:8px}
 #touchpad{display:flex;bottom:max(7px,env(safe-area-inset-bottom));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right))}
 .stick{width:105px;height:105px}
 .stick i{width:45px;height:45px;left:calc(50% - 22.5px);top:calc(50% - 22.5px)}
 .pad-right button{font-size:10px;padding:8px 6px}
 .slide-wrap{padding:5px 1px;gap:2px}.slide-wrap input{height:72px}
 .bottomhint{display:none}
 #dialog{padding:8px}.dialog-card{padding:14px;max-height:90dvh;overflow:auto}.dialog-card h2{font-size:20px}.dialog-card p{font-size:12px;line-height:1.4}
}
@media (orientation:landscape) and (max-height:340px){
 .mission{min-height:80px;max-height:85px}.mission p{display:none}
 .brand-sub{display:none}
 .kicker{display:none}
 .menu-buttons{margin:4px 0 0}.mission small{display:none}
}

#assistBtn{border-color:#87e8c3;color:#8dfde4}#resetBtn{border-color:#f6d182;color:#ffdfa0}
#stallAlert{position:absolute;left:50%;transform:translateX(-50%);top:28%;background:rgba(74,34,18,.9);border:1px solid #ffd060;color:#ffdb80;font-size:12px;font-weight:800;padding:9px 14px;border-radius:11px;text-align:center;max-width:80vw;z-index:8;pointer-events:none}
@media (max-width:700px){#stallAlert{top:32%;font-size:10px;padding:7px 9px}}

<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<canvas id="scene" aria-label="KF-21 쉬운 조종 3D 비행 게임"></canvas>
<div id="app"></div>
<div id="landscapeNotice" role="dialog" aria-modal="true" aria-labelledby="landscapeHeading">
 <div class="landscape-panel">
  <div class="turn-icon" aria-hidden="true">↻</div>
  <h2 id="landscapeHeading">가로 화면으로 플레이</h2>
  <p>KF-21 비행 시뮬레이터는 가로 화면에 맞춰 제작되었습니다.<br>기기를 90° 돌려주세요.</p>
  <button type="button" id="tryLandscape">가로 전체화면 전환</button>
  <small id="orientationMessage">자동 전환이 되지 않으면 기기의 자동 회전을 켜고 가로로 돌려주세요.</small>
 </div>
</div>

<script>
/* Landscape-first behavior; browsers may require user gesture/fullscreen or manual rotation. */
(()=>{
 const notice=document.getElementById('landscapeNotice');
 const tryBtn=document.getElementById('tryLandscape');
 const msg=document.getElementById('orientationMessage');
 function updateOrientation(){
   const portrait=window.matchMedia('(orientation: portrait)').matches;
   const touch=window.matchMedia('(pointer: coarse)').matches;
   notice.setAttribute('aria-hidden',String(!(portrait&&touch)));
 }
 async function tryLandscape(){
   try{
     if(!document.fullscreenElement && document.documentElement.requestFullscreen){
       await document.documentElement.requestFullscreen();
     }
     if(screen.orientation && typeof screen.orientation.lock==='function'){
       await screen.orientation.lock('landscape');
     }else{
       msg.textContent='이 브라우저에서는 자동 회전을 지원하지 않습니다. 기기를 가로로 돌려주세요.';
     }
   }catch(_err){
     msg.textContent='가로 방향 고정이 지원되지 않습니다. 기기의 자동 회전을 켜고 가로로 돌려주세요.';
   }
   updateOrientation();
 }
 tryBtn.addEventListener('click',tryLandscape);
 window.addEventListener('resize',updateOrientation);
 window.addEventListener('orientationchange',()=>setTimeout(updateOrientation,150));
 if(screen.orientation&&screen.orientation.addEventListener){screen.orientation.addEventListener('change',updateOrientation)}
 updateOrientation();
})();
</script>
<script type="module">import 'gamefile/src/main.js';</script>
