 #touchpad .turn-buttons button{min-width:0;min-height:74px}
 #touchpad .power-panel{width:49px;max-height:140px;min-height:130px;margin-left:0;margin-right:auto;padding:4px}
 #touchpad .power-title{font-size:9px}
 #touchpad .power-track{height:77px}
 #touchpad .power-label{font-size:8px}
 #combatPanel{width:clamp(180px,30vw,225px);bottom:5px;gap:3px}
 #combatMessage{font-size:9px;min-height:25px;padding:3px}
 .combatButtons button{height:43px;font-size:10px;padding:2px}
 #damageStatus{font-size:9px}

}
@media (orientation:landscape) and (max-width:750px){
 #combatPanel{width:180px}
 #flightTopControls{left:120px;right:114px}

 #touchpad .flight-control-group button{min-width:72px}
 #touchpad .power-panel{margin-right:auto}
}

#touchpad .heading-buttons{display:flex;gap:6px}
#touchpad .heading-buttons button{min-width:65px}

<style id="easy-flight-ui">
/* Accessible mobile controls, keeping the existing landscape-first layout. */
#assistBtn{border-color:rgba(112,250,204,.6);background:rgba(10,80,73,.72);font-weight:800}
#autoLandBtn:not(.hidden){border-color:rgba(255,205,103,.6);background:rgba(101,68,10,.82)}
#bottomhint{font-weight:700;border-color:rgba(127,234,213,.4)}
@media (max-height:500px) and (orientation:landscape){
  .flighthead{top:7px;left:9px;right:9px}
  .flighthead strong{font-size:15px}
  .top-actions{gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:64%}
  .top-actions button{padding:7px 8px;font-size:10px}
  .flightdata{top:52px;left:8px;width:124px;max-height:calc(100vh - 89px);overflow-y:auto;padding:6px}
  .entry{padding:3px 0}.entry strong{font-size:12px}.entry label{font-size:9px}
  .objective{top:53px;left:50%;min-width:190px;padding:5px 7px;max-width:46vw}
  .objective strong{font-size:11px}
  #touchpad{bottom:19px;left:13px;right:13px}.stick{width:98px;height:98px}
  .pad-right button{padding:8px 5px;font-size:10px}
  #bottomhint{bottom:7px;font-size:10px;padding:5px 8px}
}

/* Distinct release marker: shown even if 3D modules cannot load. */
#kf-release-marker{position:fixed;z-index:100000;left:max(8px, env(safe-area-inset-left, 0px));top:calc(env(safe-area-inset-top, 0px) + 5px);pointer-events:none;padding:4px 8px;color:#101b2b;background:rgba(117,248,211,.93);border:1px solid #fff4;border-radius:7px;font:800 10px/1.3 system-ui,-apple-system,sans-serif;letter-spacing:.025em;box-shadow:0 2px 8px #0006}
@media (max-height:430px){#kf-release-marker{font-size:9px;padding:3px 5px}}
</style>
<style id="touch-only-landscape">
:root {color-scheme:dark}
html,body{overscroll-behavior:none;touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none}
#scene{touch-action:none}
#flightui:not(.hidden) #touchpad{display:flex!important;visibility:visible!important;opacity:1!important}
#touchpad{
 position:absolute;z-index:33;bottom:max(12px,env(safe-area-inset-bottom));
 left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));
 align-items:flex-end;justify-content:space-between;gap:18px;
 pointer-events:none;touch-action:none
}
#touchpad .pad-left,#touchpad .pad-right{pointer-events:auto;touch-action:none}
#touchpad .pad-left{display:flex;flex-direction:column;align-items:center;gap:7px;flex:none}
#touchpad .pad-left>span{font-size:clamp(10px,1.1vw,13px);font-weight:850;letter-spacing:.04em;
 background:rgba(5,21,36,.85);border:1px solid #8bb5d677;padding:4px 10px;border-radius:40px}
#touchpad .stick{
 position:relative;flex:none;width:clamp(108px,20vh,172px);height:clamp(108px,20vh,172px);
 border-radius:50%;border:3px solid rgba(155,226,255,.9);
 background:radial-gradient(circle,rgba(25,95,145,.40) 0 32%,rgba(7,31,65,.90) 67%,rgba(5,28,49,.96));
 box-shadow:inset 0 0 24px #409ad25a,0 8px 32px #0009,0 0 0 7px #8ecff51c;
 touch-action:none;-webkit-user-select:none;user-select:none
}
#touchpad .stick:before,#touchpad .stick:after{pointer-events:none;opacity:.36}
#touchpad .stick .axis{pointer-events:none;position:absolute;color:#bceaff;text-shadow:0 1px 5px #001;
 font-size:clamp(10px,1.25vw,13px);font-weight:850;z-index:1;line-height:1}
#touchpad .stick .up{top:7px;left:50%;transform:translateX(-50%)}
#touchpad .stick .down{bottom:7px;left:50%;transform:translateX(-50%)}
#touchpad .stick .left{left:8px;top:50%;transform:translateY(-50%)}
#touchpad .stick .right{right:8px;top:50%;transform:translateY(-50%)}
#touchpad .stick i{
 display:block;position:absolute;left:50%;top:50%;margin-left:-24px;margin-top:-24px;
 width:48px;height:48px;border-radius:50%;z-index:3;
 border:3px solid #e3f9ff;background:radial-gradient(circle at 35% 30%,#cdf8ff,#4fb8fb 66%,#176ca7);
 box-shadow:0 4px 20px #0019,0 0 18px #60cfff9b;
 pointer-events:none;will-change:transform;touch-action:none
}
#touchpad .stick.engaged{border-color:#ffda78;box-shadow:0 0 0 7px #ffcc492e,0 0 26px #ffdb6080}
#touchpad .pad-right{
 display:grid;grid-template-columns:repeat(3,minmax(67px,1fr));grid-template-rows:repeat(2,minmax(55px,1fr));
 gap:8px;align-items:stretch;width:clamp(222px,34vw,365px);min-width:0;
 background:none;border:0;padding:0
}
#touchpad .pad-right button{
 display:flex;min-width:0;align-items:center;justify-content:center;flex-direction:column;gap:4px;
 color:#f2f8ff;font-weight:800;font-size:clamp(10px,1.1vw,13px);
 padding:8px 4px;line-height:1.15;border-radius:13px;min-height:55px;
 border:1.5px solid rgba(143,213,255,.85);
 background:linear-gradient(155deg,rgba(26,79,117,.95),rgba(5,27,51,.96));
 box-shadow:0 5px 16px #0018;touch-action:manipulation;-webkit-tap-highlight-color:transparent
}
#touchpad .pad-right button span{display:block;font-size:clamp(17px,2.1vw,25px);line-height:1}
#touchpad .pad-right button:active{background:#235985;border-color:#ffdd8d;transform:scale(.95)}
#touchpad #touchAutoLand{border-color:#ffdb7e;background:linear-gradient(160deg,#706037,#352810)}
#touchpad #touchPause{border-color:#c4d2fa}
#bottomhint{display:none!important}
.flighthead .top-actions{display:none!important}
#flightui .flighthead{top:max(6px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:10px;pointer-events:none}
#flightui .flighthead strong{font-size:clamp(13px,2vw,20px)}
#flightui .objective{pointer-events:none;top:max(50px,calc(env(safe-area-inset-top) + 42px))}
#flightui .flightdata{z-index:2;pointer-events:none;max-height:calc(100dvh - 250px);overflow:hidden}
#menu{overflow-y:auto;max-height:100dvh}
#dialog{z-index:55}
@media (orientation:landscape) and (max-height:480px){
 #touchpad{bottom:max(6px,env(safe-area-inset-bottom));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));gap:8px}
 #touchpad .pad-left{gap:3px}
 #touchpad .pad-left>span{font-size:9px;padding:2px 6px}
 #touchpad .stick{width:clamp(104px,33vh,138px);height:clamp(104px,33vh,138px)}
 #touchpad .stick i{width:42px;height:42px;margin-left:-21px;margin-top:-21px}
 #touchpad .pad-right{width:clamp(208px,35vw,320px);gap:5px;grid-template-rows:repeat(2,50px)}
 #touchpad .pad-right button{min-height:50px;padding:3px 2px;border-radius:9px;font-size:10px;gap:2px}
 #touchpad .pad-right button span{font-size:19px}
 #flightui .flightdata{top:50px;width:112px;max-height:110px;overflow:hidden}
 #flightui .flightdata .entry:nth-of-type(n+4),#flightui .flightdata .thrbar{display:none}
 #flightui .objective{top:45px;left:50%;max-width:43vw;padding:4px 8px;min-width:0}
 #flightui .objective strong{font-size:10px}
 #flightui .flighthead .eyebrow{font-size:8px}

<div id="app"></div>
<div id="landscapeNotice" role="dialog" aria-modal="true" aria-labelledby="landscapeHeading">
 <div class="landscape-panel">
  <div class="turn-icon" aria-hidden="true">↻</div>
  <h2 id="landscapeHeading">가로 화면으로 플레이</h2>
  <p>KF-21 비행 시뮬레이터는 가로 화면에 맞춰 제작되었습니다.<br>기기를 90° 돌려주세요.</p>
  <button type="button" id="tryLandscape">가로 전체화면 전환</button>
  <small id="orientationMessage">자동 전환이 되지 않으면 기기의 자동 회전을 켜고 가로로 돌려주세요.</small>
 </div>
</div>

<script>
/* Landscape-first behavior; browsers may require user gesture/fullscreen or manual rotation. */
(()=>{
 const notice=document.getElementById('landscapeNotice');
 const tryBtn=document.getElementById('tryLandscape');
 const msg=document.getElementById('orientationMessage');
 function updateOrientation(){
   const portrait=window.matchMedia('(orientation: portrait)').matches;
   const touch=window.matchMedia('(pointer: coarse)').matches;
   notice.setAttribute('aria-hidden',String(!(portrait&&touch)));
 }
 async function tryLandscape(){
   try{
     if(!document.fullscreenElement && document.documentElement.requestFullscreen){
       await document.documentElement.requestFullscreen();
     }
     if(screen.orientation && typeof screen.orientation.lock==='function'){
       await screen.orientation.lock('landscape');
     }else{
       msg.textContent='이 브라우저에서는 자동 회전을 지원하지 않습니다. 기기를 가로로 돌려주세요.';
     }
   }catch(_err){
     msg.textContent='가로 방향 고정이 지원되지 않습니다. 기기의 자동 회전을 켜고 가로로 돌려주세요.';
   }
   updateOrientation();
 }
 tryBtn.addEventListener('click',tryLandscape);
 window.addEventListener('resize',updateOrientation);
 window.addEventListener('orientationchange',()=>setTimeout(updateOrientation,150));
 if(screen.orientation&&screen.orientation.addEventListener){screen.orientation.addEventListener('change',updateOrientation)}
 updateOrientation();
})();
</script>
